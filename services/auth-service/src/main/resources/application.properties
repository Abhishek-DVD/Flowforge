# Application
spring.application.name=auth-service
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/flowforge_auth
spring.datasource.username=flowforge
spring.datasource.password=flowforge_dev
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT
# Expiration is one hour (in milliseconds).
# JWT needs a secret key to sign tokens and verify that they haven't been tampered with.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=3600000

spring.config.import=optional:file:.env[.properties]

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

